# Block packages published less than 3 days ago (4320 minutes)
minimumReleaseAge: 4320
minimumReleaseAgeStrict: true

minimumReleaseAgeExclude:
  - '@alfresco/*'
  - '@bpmn-io/form-js-editor@2.0.1'
  - '@bpmn-io/form-js-playground@2.0.1'
  - '@bpmn-io/form-js@2.0.1'
  - bpmn-js-properties-panel@5.65.1
  - bpmn-js@18.30.1
  - diagram-js@15.27.1

overrides:
  # Security fixes
  '@module-federation/sdk>node-fetch': '^2.7.0'

allowBuilds:
  '@carbon/grid': true
  '@carbon/layout': true
  '@esbuild/darwin-arm64': true
  '@esbuild/darwin-x64': true
  '@esbuild/linux-x64': true
  '@esbuild/win32-x64': true
  '@nx/nx-darwin-arm64': true
  '@nx/nx-darwin-x64': true
  '@nx/nx-linux-x64-gnu': true
  '@nx/nx-linux-x64-musl': true
  '@nx/nx-win32-x64-msvc': true
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  fsevents: true
  husky: true
  inferno: true
  less: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  pdfjs-dist: true
  playwright: true
  sass: true
  sharp: true
  unrs-resolver: true
